version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: qa_tool_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qa_tool
    ports:
      - "5432:5432"
    volumes:
      - qa_tool_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  qa_tool_pgdata:
